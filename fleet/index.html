<style>
:root{--paper:#F7F7F3;--ink:#1F2A30;--muted:#5C6B6E;--accent:#0F6E6C;--line:#D8DCD7;--panel:#FFF}
@media(prefers-color-scheme:dark){:root{--paper:#141D21;--ink:#E5E8E4;--muted:#8FA0A2;
--accent:#4BB3AE;--line:#2A373C;--panel:#1B262B}}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);margin:0;font-family:Charter,Georgia,serif;
display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:var(--panel);border:1px solid var(--line);padding:28px 26px;max-width:22rem;width:100%}
h1{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:17px;margin:0 0 4px;letter-spacing:.02em}
p{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.5}
input{width:100%;box-sizing:border-box;font-family:ui-monospace,'SF Mono',Menlo,monospace;
font-size:17px;letter-spacing:.08em;padding:11px 12px;border:1px solid var(--line);
background:var(--paper);color:var(--ink);border-radius:0;text-transform:uppercase}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{margin-top:12px;width:100%;font-family:ui-monospace,'SF Mono',Menlo,monospace;
font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:11px;border:1px solid var(--accent);
background:var(--accent);color:var(--panel);cursor:pointer}
button[disabled]{opacity:.55;cursor:default}
.err{color:#A9382F;font-size:13px;margin-top:12px;min-height:1.2em}
@media(prefers-color-scheme:dark){.err{color:#D4756C}}
</style>
