<style>
:root{--paper:#F7F7F3;--ink:#1F2A30;--muted:#5C6B6E;--accent:#0F6E6C;--line:#D8DCD7;--panel:#FFF}

--accent:#4BB3AE;--line:#2A373C;--panel:#1B262B}}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);margin:0;font-family:Charter,Georgia,serif;
display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:var(--panel);border:1px solid var(--line);padding:28px 26px;max-width:22rem;width:100%}
h1{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:17px;margin:0 0 4px;letter-spacing:.02em}
p{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.5}
input{width:100%;box-sizing:border-box;font-family:ui-monospace,'SF Mono',Menlo,monospace;
font-size:17px;letter-spacing:.08em;padding:11px 12px;border:1px solid var(--line);
background:var(--paper);color:var(--ink);border-radius:0;text-transform:uppercase}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{margin-top:12px;width:100%;font-family:ui-monospace,'SF Mono',Menlo,monospace;
font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:11px;border:1px solid var(--accent);
background:var(--accent);color:var(--panel);cursor:pointer}
button[disabled]{opacity:.55;cursor:default}
.err{color:#A9382F;font-size:13px;margin-top:12px;min-height:1.2em}
@media(prefers-color-scheme:dark){.err{color:#D4756C}}
</style>

  var base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  var bits=new Uint8Array(await crypto.subtle.deriveBits(
    {name:"PBKDF2",salt:b(D.s),iterations:ITER,hash:"SHA-256"},base,512));
  var ak=bits.slice(0,32), mk=bits.slice(32,64);
  var iv=b(D.iv), ct=b(D.ct), mac=b(D.mac);
  // Verify BEFORE decrypting: a tampered payload is rejected, never parsed.
  var hk=await crypto.subtle.importKey("raw",mk,{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  var signed=new Uint8Array(iv.length+ct.length); signed.set(iv); signed.set(ct,iv.length);
  if(!await crypto.subtle.verify("HMAC",hk,mac,signed)) throw new Error("bad passphrase");
  var ck=await crypto.subtle.importKey("raw",ak,{name:"AES-CBC"},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:iv},ck,ct);
  return new TextDecoder().decode(pt);
}
function render(html){
  document.open(); document.write(html); document.close();
}
async function attempt(pw,remember){
  var html=await open_(pw);
  if(remember){try{localStorage.setItem(KEY,pw);}catch(e){}}
  render(html);
}
document.getElementById("f").addEventListener("submit",async function(e){
  e.preventDefault();
  var go=document.getElementById("go"), err=document.getElementById("err");
  go.disabled=true; go.textContent="Unlocking"; err.textContent="";
  try{ await attempt(document.getElementById("pw").value.trim().toUpperCase(),true); }
  catch(_){ err.textContent="Wrong passphrase."; go.disabled=false; go.textContent="Unlock";
            document.getElementById("pw").value=""; }
});
// A device that has unlocked before goes straight in.
(async function(){
  var saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  if(!saved) return;
  try{ await attempt(saved,false); }
  catch(_){ try{localStorage.removeItem(KEY);}catch(e){} }
})();
