<style>
:root{color-scheme:light dark;--paper:#f6f7f9;--ink:#182026;--muted:#59636f;--accent:#0f766e;
--accent-ink:#fff;--line:#dce1e7;--panel:#fff;--field:#f8fafb;--error:#b42318;--shadow:0 16px 48px #1820260a}
@media(prefers-color-scheme:dark){:root{--paper:#121418;--ink:#f2f4f7;--muted:#a2abb6;
--accent:#55c6bd;--accent-ink:#092e2b;--line:#343a44;--panel:#1b1f25;--field:#15191e;--error:#ffb4a9;--shadow:none}}
*{box-sizing:border-box}
html{min-height:100%;background:var(--paper)}
body{min-height:100vh;min-height:100dvh;margin:0;padding:24px;display:grid;place-items:center;
background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
-webkit-font-smoothing:antialiased}
.box{width:100%;max-width:408px;padding:32px;border:1px solid var(--line);border-radius:12px;
background:var(--panel);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:30px;font-size:16px;font-weight:700;letter-spacing:-.02em}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink)}
.mark svg{width:20px;height:20px}
.eyebrow{color:var(--muted);font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;margin:0 0 9px}
h1{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.035em;margin:0 0 12px}
.description{font-size:14px;line-height:1.6;color:var(--muted);margin:0 0 26px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
input{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;
background:var(--field);color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,monospace;
font-size:16px;letter-spacing:.04em;text-transform:uppercase}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button{display:block;margin-top:14px;width:100%;min-height:48px;padding:12px 16px;border:0;border-radius:8px;
background:var(--accent);color:var(--accent-ink);font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}
button[disabled]{opacity:.7;cursor:progress}
.err{color:var(--error);font-size:13px;line-height:1.5;margin:12px 0 0;min-height:20px}
.privacy{font-size:12px;line-height:1.5;color:var(--muted);margin:18px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.unlock-status{display:none;color:var(--muted);font-size:14px;line-height:1.5;text-align:center}
html.fleet-unlocking #gate{display:none}
html.fleet-unlocking .unlock-status{display:block}
@media(max-width:380px){body{padding:16px}.box{padding:26px 22px}h1{font-size:26px}}
</style>
<script>
// Decide before the gate is parsed: returning readers never see a login flash.
try{if(localStorage.getItem("harbormaster.pw"))document.documentElement.classList.add("fleet-unlocking");}catch(e){}
</script>

  <p class="eyebrow">Your private workspace</p>
  <h1 id="welcome">Welcome back.</h1>
  <p class="description">Downloads, revenue and App Store updates. Your whole app portfolio, in one place.</p>
  <form id="f">
    <label for="pw">Passphrase</label>
    <input id="pw" name="passphrase" type="password" autocomplete="current-password"
      autocapitalize="characters" spellcheck="false" placeholder="Enter your passphrase" aria-describedby="err" required>
    <button id="go" type="submit">Unlock workspace</button>
  </form>
  <p class="err" id="err" role="alert"></p>
  <p class="privacy">Your passphrase stays on this device.</p>
</main>
