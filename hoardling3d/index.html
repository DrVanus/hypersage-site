  <style>
    html,body{margin:0;height:100%;background:#17100e;overflow:hidden}
    #boot{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:18px;
      background:radial-gradient(120% 80% at 50% 38%,#2a1710 0%,#17100e 55%,#0c0705 100%);
      font-family:Georgia,"Times New Roman",serif;text-align:center;
      padding:0 24px;transition:opacity .38s ease}
    #boot.gone{opacity:0;pointer-events:none}
    #boot-mark{font-size:clamp(34px,11vw,54px);font-weight:700;letter-spacing:.02em;
      color:#ffd75e;text-shadow:0 2px 0 #7a4a12,0 0 34px rgba(255,180,60,.34)}
    #boot-sub{font-style:italic;font-size:clamp(13px,4vw,17px);color:#ff9a3c;opacity:.92}
    #boot-track{width:min(220px,56vw);height:5px;border-radius:3px;
      background:rgba(255,233,196,.13);overflow:hidden}
    #boot-fill{height:100%;width:0;border-radius:3px;
      background:linear-gradient(90deg,#ff9a3c,#ffd75e);
      box-shadow:0 0 12px rgba(255,190,80,.65);transition:width .22s ease-out}
    #boot-note{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.10em;
      text-transform:uppercase;color:rgba(255,233,196,.46)}
    /* THE PAGE HAD NO <a> AT ALL. sitemap.xml declares /hoardling3d/ and its
       privacy, terms and support pages; all four answer 200, and the one a
       visitor actually lands on linked to none of them and offered no way back
       to the studio.

       NOT IN #boot, WHICH IS THE OBVIOUS PLACE AND THE WRONG ONE. The 2D build
       puts its row there because its title screen carries the same pair again
       (TITLE_LEGAL in game.js); this build has no such thing. And #boot here is
       not merely faded — game.js REMOVES it once ART.load resolves, which on a
       warm cache is under a second: I measured the overlay already gone 900ms
       after DOMContentLoaded. A row that lives in it is a blink.

       So it is its own element, and it leaves on the player's FIRST touch
       instead of on the loader's. Before that touch the game can only be
       showing its title screen, whose bottom strip is empty at every width I
       shot; after it the row is removed from the DOM entirely, so it cannot sit
       over the machine tray that fills the bottom edge during a siege. The
       wrapper never takes a pointer — only the four links do. */
    #shell-legal{position:fixed;left:0;right:0;z-index:10;text-align:center;
      bottom:max(10px,env(safe-area-inset-bottom));pointer-events:none;
      font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.04em;
      transition:opacity .3s ease}
    #shell-legal.gone{opacity:0}
    #shell-legal a{pointer-events:auto;color:rgba(255,233,196,.52);
      text-decoration:none;padding:6px 8px}
    #shell-legal a:hover{color:#ffd75e;text-decoration:underline}
    #shell-legal span{color:rgba(255,233,196,.28)}
    /* A short window — landscape on a phone — is the one shape where the title
       screen's own buttons can reach the bottom edge. Rather than guess the
       clearance, stand the row down: a link that covers a game control is a
       worse defect than the one being fixed. */
    @media (max-height:560px){#shell-legal{display:none}}
    /* An ember drifting up behind the wordmark: proof of life while the bytes
       land, and it costs one compositor-only animation. */
    #boot-ember{position:absolute;width:5px;height:5px;border-radius:50%;
      background:#ffb43c;filter:blur(1px);opacity:0;
      animation:emb 3.4s ease-in-out infinite}
    @keyframes emb{0%{transform:translate(0,60px) scale(.5);opacity:0}
      22%{opacity:.85}100%{transform:translate(16px,-150px) scale(1.1);opacity:0}}
    @media (prefers-reduced-motion:reduce){
      #boot-ember{display:none}#boot-fill{transition:none}#boot{transition:none}}
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    
    <div id="safe-probe" style="position:absolute;visibility:hidden;pointer-events:none;
         padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);"></div>
    <canvas id="game-canvas" aria-label="Hoardling game area"></canvas>
    
  </div>
  <div id="boot" role="status" aria-live="polite">
    <div id="boot-ember"></div>
    <div id="boot-mark">HOARDLING</div>
    <div id="boot-sub">Too young for dragonfire, so he built his own.</div>
    <div id="boot-track"><div id="boot-fill"></div></div>
    <div id="boot-note">stoking the forge</div>
  </div>
  <nav id="shell-legal" aria-label="Hoardling 3D legal and studio links">
    <a href="privacy.html">Privacy</a><span>·</span><a href="terms.html">Terms</a><span>·</span><a href="support.html">Support</a><span>·</span><a href="https://hypersage.ai/">HyperSage</a>
  </nav>
  <script>
  /* Stand the row down on the first input the player gives the game, and take
     it out of the DOM after the fade so nothing of it is left over the siege.
     A click on one of its own links must NOT count as that input — it is the
     row doing its job — so the listener ignores anything inside it. */
  (function () { try {
    var n = document.getElementById('shell-legal');
    if (!n) return;
    var go = function (e) {
      if (e && e.target && n.contains(e.target)) return;
      document.removeEventListener('pointerdown', go, true);
      document.removeEventListener('keydown', go, true);
      n.classList.add('gone');
      setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 350);
    };
    document.addEventListener('pointerdown', go, true);
    document.addEventListener('keydown', go, true);
  } catch (e) {} })();
  </script>

  <script>window.__ART_EXT__="webp";</script>
  <script src="lb-config.js?v=20260913-boardoff"></script>
  <script src="game.js?v=20260814-isolate" defer></script>
</body>
