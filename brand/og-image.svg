<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">HyperSage AI Labs — Software with a point of view.</title>
  <desc id="description">Social preview for HyperSage, an independent product studio.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071317"/>
      <stop offset="0.52" stop-color="#080b11"/>
      <stop offset="1" stop-color="#151326"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#6bcde4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="tealGlow">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
    <clipPath id="rightPanel"><rect x="820" y="0" width="380" height="630"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="45" cy="10" r="290" fill="url(#tealGlow)"/>
  <circle cx="1160" cy="125" r="400" fill="url(#violetGlow)"/>

  <g transform="translate(80 72)">
    <path d="M7 24C7 8 24 4 34 15L50 33C60 44 77 40 77 24S60 4 50 15L34 33C24 44 7 40 7 24Z"
          fill="none" stroke="url(#brand)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="101" y="18" fill="#2dd4bf" font-family="JetBrains Mono, Menlo, monospace" font-size="14" font-weight="600" letter-spacing="3.2">INDEPENDENT PRODUCT STUDIO</text>
    <text x="101" y="43" fill="#eaeef5" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="19" font-weight="700">HyperSage AI Labs</text>
  </g>

  <g transform="translate(80 215)">
    <text x="0" y="0" fill="#eaeef5" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-2.5">Software with</text>
    <text x="0" y="80" fill="#2dd4bf" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-2.5">a point of view.</text>
    <rect x="0" y="111" width="575" height="4" rx="2" fill="url(#brand)"/>
    <text x="0" y="167" fill="#bdc8d9" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400">Distinctive consumer apps and original games.</text>
    <text x="0" y="201" fill="#bdc8d9" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400">Context-aware AI where it improves the product.</text>
  </g>

  <g clip-path="url(#rightPanel)" opacity="0.94">
    <circle cx="995" cy="317" r="139" fill="#0d131d" stroke="#a78bfa" stroke-opacity="0.2"/>
    <circle cx="995" cy="317" r="104" fill="none" stroke="#64748b" stroke-opacity="0.34"/>
    <circle cx="995" cy="317" r="78" fill="#0b1119" stroke="url(#brand)" stroke-opacity="0.58"/>
    <circle cx="995" cy="317" r="6" fill="#2dd4bf" filter="url(#softGlow)"/>
    <circle cx="995" cy="178" r="5" fill="#a78bfa" filter="url(#softGlow)"/>
    <circle cx="1134" cy="317" r="4" fill="#2dd4bf" filter="url(#softGlow)"/>
    <circle cx="995" cy="456" r="4" fill="#6bcde4" filter="url(#softGlow)"/>
    <path d="M856 317H917M1073 317H1134M995 178V239M995 395V456" stroke="#8190a6" stroke-opacity="0.34"/>
    <path d="M876 240C909 203 945 185 995 178M1112 236C1081 203 1048 186 995 178M880 400C911 432 946 451 995 456"
          fill="none" stroke="url(#brand)" stroke-opacity="0.38"/>
    <text x="995" y="305" text-anchor="middle" fill="#eaeef5" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="15" font-weight="600">PRODUCT</text>
    <text x="995" y="329" text-anchor="middle" fill="#eaeef5" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="15" font-weight="600">INTELLIGENCE</text>
    <text x="995" y="352" text-anchor="middle" fill="#8894a8" font-family="JetBrains Mono, Menlo, monospace" font-size="9" letter-spacing="1.4">CONTEXT · TOOLS · RULES</text>

    <g font-family="JetBrains Mono, Menlo, monospace" font-size="10" letter-spacing="1.3" fill="#98a6bb">
      <text x="854" y="307">CONTEXT</text>
      <text x="1092" y="307">RESULT</text>
      <text x="953" y="158">KNOWLEDGE</text>
      <text x="964" y="484">SAFEGUARDS</text>
    </g>
  </g>

  <g transform="translate(80 563)" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#8894a8">
    <text>Wingmate · Quietoak · CryptoSage · Saffra · StoryVault · Nightshelf · Hexhunter</text>
    <text y="27">Mythwright · The One · Rowan · Alder · Waddleton · Mythkin</text>
  </g>
</svg>
